name: Android APK (debug)

# Builds a sideload-ready debug APK on every push and PR, and uploads it as a
# downloadable artifact — no local Android Studio needed to get the APK.
on:
  push:
    branches: [ "main", "arena/01a0859b-steam-downloader-2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # v3 installs the retired legacy "tools" SDK package by default and
        # dies with "Failed to find package 'tools'" (Google removed it from
        # the SDK manifest in Sept 2026). v4 defaults to platform-tools only;
        # the exact packages each job needs are installed in the next step.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses & install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.1.0 (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report failure details to the PR (log tail, if any)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "❌ CI build failed on \`${{ github.ref_name }}\` (commit ${{ github.sha }})."
            echo
            echo '```text'
            tail -n 150 build.log
            echo '```'
          } > failure-report.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file failure-report.md || true

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: depotdownloader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to apk-builds branch (direct-download channel)
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$DIST/DepotDownloader-debug.apk"
          {
            echo "# DepotDownloader Mobile — debug APK"
            echo
            echo "This branch (\`apk-builds\`) is the project's **rolling debug channel**:"
            echo "every successful CI build force-pushes the newest debug-signed APK here"
            echo "together with its SHA-256, for direct download without the Releases UI."
            echo
            echo "**Prefer the Releases page (it is marked a pre-release):**"
            echo "https://github.com/${{ github.repository }}/releases/tag/debug-apk"
            echo
            echo "ℹ️ If GitHub shows \"Sorry about that, but we can't show files that are"
            echo "this big right now\" — that is NORMAL for a 30MB APK. Click the **Raw**"
            echo "button at the top-right of that page to download the file."
            echo
            echo "Auto-built by the Android APK (debug) workflow."
            echo "Workflow run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            echo "SHA256:"
            sha256sum "$DIST/DepotDownloader-debug.apk"
          } > "$DIST/README.md"
          cd "$DIST"
          git init -q
          git config user.name "arena-ci[bot]"
          git config user.email "arena-ci[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -q -b apk-builds
          git add DepotDownloader-debug.apk README.md
          git commit -q -m "DepotDownloader debug APK — run ${{ github.run_id }}" || true
          git push --force origin apk-builds

      - name: Publish APK to a GitHub Release (clean download page)
        if: success() && github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DepotDownloader-debug.apk
          sha256sum DepotDownloader-debug.apk > SHA256SUMS.txt
          SHA256=$(cut -d' ' -f1 SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          ## DepotDownloader Mobile — Debug APK (auto build)  🔶 PRE-RELEASE

          This is a **rolling pre-release**: every successful build on \`main\`
          re-publishes this same tag, so what you download here is always the
          newest debug build. The **\`apk-builds\` branch is the debug channel**
          behind it — CI force-pushes the same APK there (\`DepotDownloader-debug.apk\`
          + its checksum) on every run for direct/raw download without the
          Releases UI.

          **To install on any Android phone:**
          1. Download \`DepotDownloader-debug.apk\` below (on the phone itself is fastest).
          2. Open the downloaded file → allow *Install unknown apps* if asked → **Install**.
          3. Open the app → sign in with your Steam account (Steam Guard / 2FA supported).

          ⚠️ This APK is **debug-signed** (the certificate is public in this repo) —
          fine for testing and for installing updates over previous builds, but it
          must never be used for a production release. Android shows a one-time
          "unknown source" warning because of this.

          **SHA-256** of \`DepotDownloader-debug.apk\`:
          \`\`\`
          ${SHA256}
          \`\`\`
          Also attached as \`SHA256SUMS.txt\`. Verify before installing if you
          downloaded the APK over an untrusted network.

          Build provenance: workflow run \`${{ github.run_id }}\`, commit \`${{ github.sha }}\`.

          Read the README for the full sign-in/2FA notes, install steps and disclaimer.
          EOF
      - name: Create/update the debug pre-release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk
          name: DepotDownloader — Debug APK (auto build)
          prerelease: true
          draft: false
          files: |
            DepotDownloader-debug.apk
            SHA256SUMS.txt
          body_path: release-notes.md
