name: Android APK (debug)

# Builds a sideload-ready debug APK on every push and PR, and uploads it as a
# downloadable artifact — no local Android Studio needed to get the APK.
#
# On pushes (never on PRs) the same APK is published as the repo's **latest
# release** and force-pushed to the `apk-builds` branch, so both "give me the
# newest APK" links below are always live and never change:
#
#   https://github.com/Shankers8811/Steam-Downloader-2/releases/latest/download/DepotDownloader-debug.apk
#   https://github.com/Shankers8811/Steam-Downloader-2/tree/apk-builds
#
# The release is re-published under one rolling tag (`debug-apk`) with
# `make_latest: true` — NOT a pre-release. GitHub hides pre-releases behind a
# toggle on the repo page and `/releases/latest/download/...` does not resolve
# for them, which is why nobody could find the APK download. The notes still
# say, loudly, that the build is debug-signed and testing-only.
on:
  push:
    branches: [ "main", "arena/01a0859b-steam-downloader-2", "arena/01a0eb1f-steam-downloader-2", "arena/01a0eb9b-steam-downloader-2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # v3 installs the retired legacy "tools" SDK package by default and
        # dies with "Failed to find package 'tools'" (Google removed it from
        # the SDK manifest in Sept 2026). v4 defaults to platform-tools only;
        # the exact packages each job needs are installed in the next step.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses & install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.1.0 (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute the version stamp for this build
        id: stamp
        run: |
          # One version scheme everywhere: 1.0.<workflow run number>.
          # The run number only ever grows on this repo, so it doubles as the
          # Android versionCode (what the OS checks to update in place) and as
          # the human "which build is this" number on the release page.
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "BUILD_DATE=${BUILD_DATE}"
          } >> "$GITHUB_ENV"
          echo "Version stamp: ${VERSION_NAME} (code ${VERSION_CODE}, commit ${SHORT_SHA}, ${BUILD_DATE})"

      - name: Build debug APK (stamped with this run's version)
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug \
            -PversionCodeOverride="${VERSION_CODE}" \
            -PversionNameOverride="${VERSION_NAME}" 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report failure details to the PR (log tail, if any)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "❌ CI build failed on \`${{ github.ref_name }}\` (commit ${{ github.sha }})."
            echo
            echo '```text'
            tail -n 150 build.log
            echo '```'
          } > failure-report.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file failure-report.md || true

      - name: Stage the APK, its version stamp and checksums
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DepotDownloader-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DepotDownloader-${VERSION_NAME}-debug.apk"
          {
            echo "DepotDownloader Mobile — debug APK"
            echo
            echo "version:       ${VERSION_NAME}"
            echo "versionCode:   ${VERSION_CODE}"
            echo "commit:        ${SHORT_SHA}"
            echo "built:         ${BUILD_DATE}"
            echo "workflow run:  ${GITHUB_RUN_ID}"
            echo
            echo "always-newest download:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DepotDownloader-debug.apk"
            echo
            echo "The version shown above is what Android reports under"
            echo "Settings ▸ Apps ▸ DepotDownloader ▸ App info after installing."
          } > dist/VERSION.txt
          cd dist
          sha256sum DepotDownloader-debug.apk "DepotDownloader-${VERSION_NAME}-debug.apk" > SHA256SUMS.txt
          cat VERSION.txt
          echo
          cat SHA256SUMS.txt

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: depotdownloader-debug-apk
          path: |
            dist/DepotDownloader-debug.apk
            dist/VERSION.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to apk-builds branch (direct-download channel)
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          {
            echo "# DepotDownloader Mobile — debug APK"
            echo
            echo "**Version \`${VERSION_NAME}\`** — commit \`${SHORT_SHA}\`, built ${BUILD_DATE}."
            echo
            echo "This branch (\`apk-builds\`) is a **direct-download mirror** of the"
            echo "project's rolling debug build: every successful CI run force-pushes"
            echo "the newest debug-signed APK here together with its version stamp and"
            echo "SHA-256, for downloading without the Releases UI."
            echo
            echo "**The Releases page is the recommended download — it always names the"
            echo "current version:**"
            echo "https://github.com/${{ github.repository }}/releases/latest"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`DepotDownloader-debug.apk\` | this build (stable filename) |"
            echo "| \`DepotDownloader-${VERSION_NAME}-debug.apk\` | the same build, version pinned in the filename |"
            echo "| \`VERSION.txt\` | version / versionCode / commit / build date |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 of both APKs |"
            echo
            echo "ℹ️ If GitHub shows \"Sorry about that, but we can't show files that are"
            echo "this big right now\" — that is NORMAL for a 35MB APK. Click the **Raw**"
            echo "button at the top-right of that page to download the file."
            echo
            echo "Auto-built by the Android APK (debug) workflow — workflow run"
            echo "${{ github.run_id }}, commit \`${GITHUB_SHA}\`."
          } > README.md
          git init -q
          git config user.name "arena-ci[bot]"
          git config user.email "arena-ci[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -q -b apk-builds
          git add -A
          git commit -q -m "DepotDownloader debug APK ${VERSION_NAME} — run ${{ github.run_id }}" || true
          git push --force origin apk-builds

      - name: Write the release notes
        if: success() && github.event_name != 'pull_request'
        run: |
          # First line only — SHA256SUMS.txt lists two APKs (stable + versioned).
          SHA256="$(head -n1 dist/SHA256SUMS.txt | cut -d' ' -f1)"
          {
            echo "## DepotDownloader Mobile — debug APK  **${VERSION_NAME}**  📱"
            echo
            echo "🔶 **Testing channel: this APK is debug-signed** (the certificate is public"
            echo "in the repo). It is the project's rolling build — install it over a previous"
            echo "build without uninstalling — but it is **not** a production release."
            echo
            echo "**Version \`${VERSION_NAME}\`** · versionCode \`${VERSION_CODE}\` · commit \`${SHORT_SHA}\` · built ${BUILD_DATE}"
            echo
            echo "This release is **re-published on every successful build on \`main\`** under"
            echo "the same tag, so the link below is the permanent always-newest download:"
            echo
            echo "\`\`\`text"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/DepotDownloader-debug.apk"
            echo "\`\`\`"
            echo
            echo "### Assets"
            echo
            echo "| Asset | What it is |"
            echo "| --- | --- |"
            echo "| \`DepotDownloader-debug.apk\` | the APK (stable filename — always the newest build) |"
            echo "| \`DepotDownloader-${VERSION_NAME}-debug.apk\` | the same APK with the version in the filename |"
            echo "| \`VERSION.txt\` | version, versionCode, commit, build date |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 of both APKs |"
            echo
            echo "### Install on any Android phone"
            echo
            echo "1. Download \`DepotDownloader-debug.apk\` below (on the phone itself is fastest)."
            echo "2. Open the downloaded file → allow *Install unknown apps* if asked → **Install**."
            echo "   Android 7.0+ (API 24). Installing over an older build just updates it —"
            echo "   **Settings ▸ Apps ▸ DepotDownloader ▸ App info** shows the version above."
            echo "3. Open the app → sign in with your Steam account (Steam Guard / 2FA supported)."
            echo
            echo "**SHA-256** (\`DepotDownloader-debug.apk\`):"
            echo
            echo "\`\`\`"
            echo "${SHA256}"
            echo "\`\`\`"
            echo
            echo "Also attached as \`SHA256SUMS.txt\`. Verify before installing if you downloaded"
            echo "the APK over an untrusted network."
            echo
            echo "Build provenance: workflow run \`${{ github.run_id }}\`, commit \`${{ github.sha }}\`,"
            echo "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Read the [README](https://github.com/${{ github.repository }}#install-the-apk)"
            echo "for the full sign-in/2FA notes, install steps and disclaimer."
          } > release-notes.md
          cat release-notes.md

      - name: Create/update the rolling debug release (latest)
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk
          name: "DepotDownloader — Debug APK (latest: ${{ steps.stamp.outputs.version_name }})"
          # NOT a pre-release: pre-releases are hidden behind a toggle on the
          # repo page and /releases/latest/... does not resolve for them.
          prerelease: false
          make_latest: true
          draft: false
          files: |
            dist/DepotDownloader-debug.apk
            dist/DepotDownloader-${{ steps.stamp.outputs.version_name }}-debug.apk
            dist/VERSION.txt
            dist/SHA256SUMS.txt
          body_path: release-notes.md
