name: Emulated app smoke tests

# Self-drives the app on a real API-34 Android emulator (GitHub runner, KVM)
# plus JVM/Robolectric engine tests — the agent's emulation rig to catch
# device-only bugs without needing anyone's Steam account. Every failure
# detail is echoed back into a comment on the pull request for the branch
# (log hosts are unreliable from the dev sandbox). JVM runs also record the
# Roborazzi UI screenshots used by the README.
on:
  push:
    branches: [ "main", "arena/01a0859b-steam-downloader-2", "arena/01a0eb1f-steam-downloader-2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Engine logic tests (Robolectric JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Robolectric unit tests (also records the README UI screenshots)
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest -Proborazzi.test.record=true 2>&1 | tee unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Upload UI screenshots (Roborazzi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Report unit-test verdict to the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          NUM="${EVENT_PR}"
          if [ -z "$NUM" ]; then
            NUM=$(gh pr list --repo "${{ github.repository }}" --head "$GITHUB_REF_NAME" --state all --json number --jq '.[0].number // ""')
          fi
          [ -z "$NUM" ] && NUM=1
          if [ -f unit-tests.log ] && grep -qE "BUILD SUCCESSFUL" unit-tests.log; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "✅ Robolectric engine tests passed (commit ${{ github.sha }})."
            exit 0
          fi
          {
            echo '❌ Robolectric engine tests failed (commit ${{ github.sha }}).'
            echo
            echo 'Failure messages from the test reports:'
            echo '```'
            grep -l '<failure' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -6 | while read f; do
              echo "---- $f"
              grep -oaE 'message="[^"]{0,600}' "$f" | head -4 | sed 's/^message="//'
              echo
            done
            echo '```'
            echo 'Failures and error lines:'
            echo '```'
            grep -aE "FAILED$|e: |error:|AssertionError|expected|Exception" unit-tests.log | head -40
            echo '```'
            echo 'Tail:'
            echo '```'
            tail -n 40 unit-tests.log
            echo '```'
          } > pr-comment.md 2>&1 || true
          OUT=$(gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file pr-comment.md 2>&1)
          if [ $? -ne 0 ]; then
            printf '::error title=PR-comment-failed::%s\n' "$(echo "$OUT" | head -c 400)"
          fi
          exit 0

  emulator-tests:
    name: APK boot smoke on Android 14 emulator (API 34, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator, system image and platform packages
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" \
            "emulator" "system-images;android-34;google_apis;x86_64" "cmdline-tools;latest"

      - name: Set up Gradle (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build, boot emulator, run instrumented smoke tests
        run: |
          set +e
          bash scripts/emu-smoke.sh 2>&1 | tee emulator-tests.log
          exit ${PIPESTATUS[0]}

      - name: Report emulation verdict to the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          NUM="${EVENT_PR}"
          if [ -z "$NUM" ]; then
            NUM=$(gh pr list --repo "${{ github.repository }}" --head "$GITHUB_REF_NAME" --state all --json number --jq '.[0].number // ""')
          fi
          [ -z "$NUM" ] && NUM=1
          if [ -f emulator-tests.log ] && grep -q "INSTRUMENTATION_OK" emulator-tests.log; then
            {
              echo "✅ Emulated APK smoke tests passed on API-34 emulator (commit ${{ github.sha }})."
              echo '```'
              grep -aE "INSTRUMENTATION_OK|PASSED|OK    |BUILD SUCCESSFUL" emulator-tests.log | head -30
              echo '```'
            } > pr-comment.md
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file pr-comment.md
            exit 0
          fi
          {
            echo '❌ Emulated APK smoke tests FAILED (commit ${{ github.sha }}).'
            echo
            echo 'Error lines:'
            echo '```'
            grep -aE "FAILED|Error|Unresolved|FAILURES!!!|Exception|INSTRUMENTATION_|AVDMGR=|ANDROID_AVD_HOME|ANDROID_SDK_HOME" emulator-tests.log | head -80
            echo '```'
            echo 'Tail:'
            echo '```'
            tail -n 120 emulator-tests.log
            echo '```'
          } > pr-comment.md 2>&1 || true
          OUT=$(gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file pr-comment.md 2>&1)
          if [ $? -ne 0 ]; then
            printf '::error title=PR-comment-failed::%s\n' "$(echo "$OUT" | head -c 400)"
          fi
          exit 0
