name: Emulated app smoke tests

# Self-drives the app on a real API-34 Android emulator (KVM on the GitHub
# runner) plus JVM/Robolectric engine tests — the agent's emulation rig to
# catch device-only bugs without needing anyone's Steam account.
on:
  push:
    branches: [ "arena/01a0859b-steam-downloader-2" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Engine logic tests (Robolectric JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.1.0 (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Robolectric unit tests
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests "com.example.DownloadEnginePersistenceTest" 2>&1 | tee unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            unit-tests.log

      - name: Report unit-test verdict to PR #1
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f unit-tests.log ] && grep -qE "BUILD SUCCESSFUL" unit-tests.log; then
            gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body "✅ Robolectric engine tests passed (commit ${{ github.sha }})."
            exit 0
          fi
          {
            echo '❌ Robolectric engine tests failed (commit ${{ github.sha }}). Log tail:'
            echo '```'
            if [ -f unit-tests.log ]; then tail -n 200 unit-tests.log; else echo "(no log captured)"; fi
            echo '```'
          } > pr-comment.md
          gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body-file pr-comment.md
          exit 0

  emulator-tests:
    name: APK boot smoke on Android 14 emulator (API 34, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.1.0 (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6P
          disk-size: 4G
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -memory 4096
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.example.EmulatedBootSmokeTest 2>&1 | tee emulator-tests.log
            echo "instrumentation exit: ${PIPESTATUS[0]}"
            exit ${PIPESTATUS[0]}

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            app/build/reports/androidTests/connected/
            emulator-tests.log

      - name: Report emulation verdict to PR #1
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f emulator-tests.log ] && grep -q "instrumentation exit: 0" emulator-tests.log; then
            gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body "✅ Emulated APK smoke tests passed on API-34 emulator (commit ${{ github.sha }}). Log excerpt:"
            {
              echo '```'
              grep -E "BUILD SUCCESSFUL|PASSED|OK    |tests? (completed|finished)" emulator-tests.log | tail -n 30
              echo '```'
            } > pr-comment.md
            gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body-file pr-comment.md
            exit 0
          fi
          {
            echo '❌ Emulated APK smoke tests FAILED (commit ${{ github.sha }}). Log tail:'
            echo '```'
            if [ -f emulator-tests.log ]; then tail -n 200 emulator-tests.log; else echo "(no log captured)"; fi
            echo '```'
          } > pr-comment.md
          gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body-file pr-comment.md
          exit 0
