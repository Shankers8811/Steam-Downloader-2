name: Emulated app smoke tests

# Self-drives the app on a real API-34 Android emulator (GitHub runner, KVM)
# plus JVM/Robolectric engine tests — the agent's emulation rig to catch
# device-only bugs without needing anyone's Steam account. Every failure
# detail is echoed back into a PR #1 comment (log hosts are unreliable).
on:
  push:
    branches: [ "arena/01a0859b-steam-downloader-2" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Engine logic tests (Robolectric JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Robolectric unit tests
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests "com.example.DownloadEnginePersistenceTest" 2>&1 | tee unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Report unit-test verdict to PR #1
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f unit-tests.log ] && grep -qE "BUILD SUCCESSFUL" unit-tests.log; then
            gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body "✅ Robolectric engine tests passed (commit ${{ github.sha }})."
            exit 0
          fi
          {
            echo '❌ Robolectric engine tests failed (commit ${{ github.sha }}).'
            echo
            echo 'Failures and error lines:'
            echo '```'
            grep -aE "FAILED$|e: |error:|AssertionError|expected|Exception" unit-tests.log | head -60
            echo '```'
            echo 'Tail:'
            echo '```'
            tail -n 60 unit-tests.log
            echo '```'
          } > pr-comment.md 2>&1 || true
          OUT=$(gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body-file pr-comment.md 2>&1)
          if [ $? -ne 0 ]; then
            printf '::error title=PR-comment-failed::%s\n' "$(echo "$OUT" | head -c 400)"
          fi
          exit 0

  emulator-tests:
    name: APK boot smoke on Android 14 emulator (API 34, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Also provision JDK 21 (some AGP/KSP internals call newer APIs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator, system image and platform packages
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" \
            "emulator" "system-images;android-34;google_apis;x86_64" "cmdline-tools;latest"

      - name: Set up Gradle (repo deliberately ships no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build, boot emulator, run instrumented smoke tests
        run: |
          set +e
          bash scripts/emu-smoke.sh 2>&1 | tee emulator-tests.log
          exit ${PIPESTATUS[0]}

      - name: Report emulation verdict to PR #1
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f emulator-tests.log ] && grep -q "INSTRUMENTATION_OK" emulator-tests.log; then
            {
              echo "✅ Emulated APK smoke tests passed on API-34 emulator (commit ${{ github.sha }})."
              echo '```'
              grep -aE "INSTRUMENTATION_OK|PASSED|OK    |BUILD SUCCESSFUL" emulator-tests.log | head -30
              echo '```'
            } > pr-comment.md
            gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body-file pr-comment.md
            exit 0
          fi
          {
            echo '❌ Emulated APK smoke tests FAILED (commit ${{ github.sha }}).'
            echo
            echo 'Error lines:'
            echo '```'
            grep -aE "FAILED|Error|Unresolved|FAILURES!!!|Exception|INSTRUMENTATION_|AVDMGR=|ANDROID_AVD_HOME|ANDROID_SDK_HOME" emulator-tests.log | head -80
            echo '```'
            echo 'Tail:'
            echo '```'
            tail -n 120 emulator-tests.log
            echo '```'
          } > pr-comment.md 2>&1 || true
          OUT=$(gh issue comment 1 --repo Shankers8811/Steam-Downloader-2 --body-file pr-comment.md 2>&1)
          if [ $? -ne 0 ]; then
            printf '::error title=PR-comment-failed::%s\n' "$(echo "$OUT" | head -c 400)"
          fi
          exit 0
